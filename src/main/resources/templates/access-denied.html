<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Cookiegram</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3c4.97 0 9 4.03 9 9s-4.03 9-9 9-9-4.03-9-9 4.03-9 9-9m0-1C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                <circle cx="8" cy="10" r="1.5"/>
                <circle cx="12" cy="8" r="1.5"/>
                <circle cx="15" cy="11" r="1.5"/>
                <circle cx="10" cy="14" r="1.5"/>
                <circle cx="14" cy="15" r="1.5"/>
            </svg>
            <span class="logo-text">Cookiegram</span>
        </a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a th:href="@{/logout}" class="btn btn-outline">Logout</a></li>
        </ul>
    </nav>
    <div class="access-denied-container">
        <div class="access-denied-card">
            <svg class="access-denied-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <h1>Access Denied</h1>
            <p>You don't have permission to view this page. Please contact an administrator if you believe this is an error.</p>
            <div class="access-denied-buttons" style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem;">
                <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Return to Home</a>
                <a th:href="@{/logout}" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
